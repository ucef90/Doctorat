[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoa-pinn"
version = "0.7.0"
description = "Reproducible multi-PDE PyTorch study of co-adaptive, measure-corrected, volume-weighted and variational residual-attention PINNs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "matplotlib>=3.9,<4",
  "PyYAML>=6.0,<7",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
recoa-pinn = "recoa_pinn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
