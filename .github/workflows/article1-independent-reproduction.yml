name: Article 1 independent reproduction
on:
  push:
    branches: [article1/v11-submission-preparation]
    paths:
      - .github/workflows/article1-independent-reproduction.yml
      - scripts/reproduce_article1_v11.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install public pinned portability environment
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.16.1 matplotlib==3.10.5 PyYAML==6.0.2 pytest==8.4.1
          python -m pip install -e . --no-deps
      - name: Restore frozen V10 archives
        run: python scripts/restore_article1_v10.py
      - name: Run automated tests
        run: |
          mkdir -p outputs/v11_ci_tests
          python -m pytest --junitxml=outputs/v11_ci_tests/junit.xml | tee outputs/v11_ci_tests/tests.txt
      - name: Recalculate 560 models and retrain 12 predeclared cells
        run: python scripts/reproduce_article1_v11.py
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: article1-independent-reproduction
          path: |
            outputs/v11_reproduction/
            outputs/v11_ci_tests/
          retention-days: 30
